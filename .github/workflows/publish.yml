name: No package publish
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  refuse-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Do not publish to PyPI or npm
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            echo "Python packaging metadata is present. Refusing to treat a skip as a publish."
            exit 1
          fi
          echo "No package is uploaded. This repository is not published to PyPI or npm."
