name: Packaging
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  no-python-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Confirm this repo does not build a Python distribution
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            echo "Python packaging metadata is present. This workflow does not publish it."
            exit 1
          fi
          echo "No sdist or wheel. This repository does not publish a package."
