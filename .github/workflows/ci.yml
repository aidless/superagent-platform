name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # The repo's own contract: source typecheck, test typecheck, and the
      # build must all exit 0 before the suite is considered green.
      - name: Typecheck source
        run: npx tsc --noEmit

      - name: Typecheck tests
        run: npx tsc --noEmit -p tsconfig.tests.json

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npx tsc
